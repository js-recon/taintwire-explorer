<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>taintwire explorer</title>
        <link rel="icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <nav>
            <strong>taintwire explorer</strong>
            <select id="session" title="Single file: code typed in the editor. Multi file: the JS files from a js-recon.db">
                <option value="single">Single file</option>
                <option value="multi">Multi file</option>
            </select>
            <button id="generate" title="Ctrl/Cmd+Enter in the JS editor" disabled>Generate</button>
            <label>parser
                <select id="parser">
                    <option value="cs-mast">cs-mast</option>
                    <option value="babel">babel</option>
                </select>
            </label>
            <label class="button" title="Open a taintwire LadybugDB file">Open DB…<input type="file" id="open-db" hidden /></label>
            <label class="button" id="open-jsr-label" title="Load the JS files from a js-recon.db (js-recon 2.1.0-alpha.1 or newer)" hidden>Open js-recon.db…<input type="file" id="open-jsr" accept=".db" hidden /></label>
            <button id="connect" title="Use a taintwire explorer backend: an IDE to upload or build the app, and native graph builds">Connect backend</button>
            <span class="sep"></span>
            <button id="run" title="Ctrl/Cmd+Enter in the Cypher editor" disabled>Run query</button>
            <select id="examples"><option value="">Example queries…</option></select>
            <button id="fit" disabled>Fit graph</button>
            <span id="status">Loading…</span>
        </nav>
        <main>
            <section id="code" data-title="JavaScript">
                <div id="files" hidden></div>
                <div id="editor"></div>
                <iframe id="ide" allow="clipboard-read; clipboard-write" hidden></iframe>
            </section>
            <section id="cypher" data-title="Cypher · Ctrl/Cmd+Enter"></section>
            <div id="divider"></div>
            <section id="graph-pane">
                <div id="graph"></div>
                <div id="legend"></div>
                <div id="results" hidden></div>
            </section>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>taintwire explorer</title>
        <link rel="icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <nav>
            <strong>taintwire explorer</strong>
            <select id="session" title="Single file: code typed in the editor. Multi file: the JS files from a js-recon.db">
                <option value="single">Single file</option>
                <option value="multi">Multi file</option>
            </select>
            <button id="generate" title="Ctrl/Cmd+Enter in the JS editor" disabled>Generate</button>
            <button id="debug" title="Build the graph one statement at a time (F5). Click the editor's left gutter or press F9 to set a breakpoint" disabled>Debug</button>
            <span id="debug-bar" hidden>
                <button id="dbg-continue" title="Continue to the next breakpoint line or the end (F5)">Continue</button>
                <button id="dbg-over" title="Step over: run every statement of this line (F10)">Step over</button>
                <button id="dbg-into" title="Step into: run one statement (F11)">Step into</button>
                <button id="dbg-pause" title="Pause (F6)">Pause</button>
                <button id="dbg-stop" title="Stop debugging (Shift+F5)">Stop</button>
            </span>
            <label>parser
                <select id="parser">
                    <option value="cs-mast">cs-mast</option>
                    <option value="babel">babel</option>
                </select>
            </label>
            <label class="button" title="Open a taintwire LadybugDB file">Open DB…<input type="file" id="open-db" hidden /></label>
            <label class="button" id="open-jsr-label" title="Load the JS files from a js-recon.db (js-recon 2.1.0-alpha.1 or newer)" hidden>Open js-recon.db…<input type="file" id="open-jsr" accept=".db" hidden /></label>
            <span class="sep"></span>
            <button id="run" title="Ctrl/Cmd+Enter in the Cypher editor" disabled>Run query</button>
            <select id="examples"><option value="">Example queries…</option></select>
            <button id="fit" disabled>Fit graph</button>
            <span id="status">Loading…</span>
        </nav>
        <main>
            <section id="code" data-title="JavaScript">
                <div id="files" hidden></div>
                <div id="editor"></div>
            </section>
            <section id="cypher" data-title="Cypher · Ctrl/Cmd+Enter"></section>
            <div id="divider"></div>
            <section id="graph-pane">
                <div id="graph"></div>
                <div id="legend"></div>
                <div id="debug-panel" hidden></div>
                <div id="results" hidden></div>
            </section>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
